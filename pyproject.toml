[project]
name = "dashcop-edge"
version = "0.1.0"
description = "Real-Time Edge Processing System for Automated Two-Wheeler Traffic Violation Detection (DashCop Edge Reimplementation)"
readme = "README.md"
authors = [
    { name = "Anuj Anthwal", email = "anujanthwal98765432@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0,<2.0.0",
    "onnxruntime>=1.16.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
gpu = [
    "onnxruntime-gpu>=1.16.0",
]

[project.scripts]
dashcop-edge = "dashcop_edge:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
